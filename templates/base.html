<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | Fitness Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='workout.js') }}" defer></script>
</head>
<body>
    <a class="skip" href="#main">Skip to content</a>

    <header>
        <a class="brand" href="{{ url_for('home') }}">Fitness Tracker</a>

        <nav aria-label="Main navigation">
            {% for endpoint, label in [
                ('home', 'Home'),
                ('record', 'Record Workout'),
                ('history', 'Workout History'),
                ('progress', 'Track Exercise Progress')
            ] %}
                <a href="{{ url_for(endpoint) }}"
                   {% if request.endpoint == endpoint %}aria-current="page"{% endif %}>
                    {{ label }}
                </a>
            {% endfor %}
        </nav>
    </header>

    <main id="main">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
